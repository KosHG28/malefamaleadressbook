name: Android Play Store bundle

# Manual only -- this produces a signed .aab for uploading to Play Console by hand, not an
# automatic publish (no Play Console credentials are configured). See android/RELEASE_SIGNING.md
# for how the four secrets below are generated and where they're set.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Decode release keystore
        env:
          PLAYSTORE_KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAYSTORE_KEYSTORE_BASE64" ]; then
            echo "::error::PLAYSTORE_KEYSTORE_BASE64 secret is not set -- see android/RELEASE_SIGNING.md" >&2
            exit 1
          fi
          echo "$PLAYSTORE_KEYSTORE_BASE64" | base64 -d > app/release-upload-key.jks
          cat > app/keystore.properties <<EOF
          storeFile=release-upload-key.jks
          storePassword=${{ secrets.PLAYSTORE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.PLAYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build release bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f app/release-upload-key.jks app/keystore.properties

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: interlude-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
